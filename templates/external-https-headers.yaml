id: offensive-lab-external-hsts-check

info:
  name: HTTPS security header informational check (authorized project only)
  author: workshop
  severity: info
  description: |
    Makes one GET request to the authorized project endpoint and reports
    missing HSTS headers. A match does not prove exploitability.
  tags: lab,headers,educational

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "strict-transport-security:"
        case-insensitive: true
        negative: true

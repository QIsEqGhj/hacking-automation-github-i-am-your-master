id: offensive-lab-debug-exposure

info:
  name: Intentional debug endpoint exposure (training lab)
  author: workshop
  severity: info
  description: |
    Checks for a local /debug route in an educational demo application.
    A match does not necessarily mean that an exploitable vulnerability exists.
  tags: lab,exposure,educational

http:
  - method: GET
    path:
      - "{{BaseURL}}/debug"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '"LAB_DEBUG_ONLY": true'
